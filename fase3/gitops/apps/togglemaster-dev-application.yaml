apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: togglemaster-dev
    app.kubernetes.io/part-of: togglemaster-tc
    environment: dev
spec:
  project: default

  source:
    repoURL: git@github.com:1DCLT-TECH-CHALLENGE/togglemaster-tc.git
    targetRevision: main
    path: fase3/gitops/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
