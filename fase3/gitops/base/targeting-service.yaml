apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels:
    app.kubernetes.io/name: targeting-service
    app.kubernetes.io/part-of: togglemaster
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: targeting-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: targeting-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      containers:
        - name: targeting-service
          image: 590183666984.dkr.ecr.us-east-1.amazonaws.com/togglemaster-dev/targeting-service:otel-b4f0b5c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: togglemaster-runtime-config
          env:
            - name: OTEL_SERVICE_NAME
              value: togglemaster-targeting-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-runtime-secret
                  key: TARGETING_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  selector:
    app.kubernetes.io/name: targeting-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
