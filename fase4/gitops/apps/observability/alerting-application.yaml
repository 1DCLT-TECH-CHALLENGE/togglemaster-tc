apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-alerting
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:1DCLT-TECH-CHALLENGE/togglemaster-tc.git
    targetRevision: main
    path: fase4/gitops/observability/alerting
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
